name: ariana-mcp

services:
  ariana-mcp:
    image: ariana-mcp
    build:
      context: .
      dockerfile: Ariana-Mcp/Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ARIANALAB_BASE_URL: ${ARIANALAB_BASE_URL:-https://klims.labor-kneissler.de/}
      ARIANALAB_JWT_SIGNING_KEY: ${ARIANALAB_JWT_SIGNING_KEY}
      ARIANALAB_JWT_ENCRYPTION_KEY: ${ARIANALAB_JWT_ENCRYPTION_KEY}
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://10.47.0.1:11434/
      WEBUI_AUTH: False
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ariana-mcp
    restart: unless-stopped

volumes:
  open-webui-data:
